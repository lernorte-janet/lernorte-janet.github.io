# Lernorte: erstellt bei jedem Hochladen die Liste aller Materialien
# und veröffentlicht die Seite. Hier muss nichts angepasst werden.
name: Lernorte veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Liste der Materialien erstellen
        shell: python
        run: |
          import os, re, json, html, unicodedata
          FAECHER = ["mathematik", "deutsch", "musik"]
          ARTEN = {".html": "App", ".htm": "App", ".pdf": "PDF",
                   ".mp4": "Video", ".m4v": "Video", ".mov": "Video",
                   ".png": "Bild", ".jpg": "Bild", ".jpeg": "Bild",
                   ".mp3": "Audio", ".m4a": "Audio"}
          nfc = lambda s: unicodedata.normalize("NFC", s)
          def sortkey(s):
              return [int(t) if t.isdigit() else t.lower() for t in re.split(r"(\d+)", s)]
          def lesbar(name):
              stamm = os.path.splitext(name)[0]
              return re.sub(r"\s+", " ", stamm.replace("_", " ")).strip()
          def html_infos(pfad):
              with open(pfad, encoding="utf-8", errors="ignore") as f:
                  kopf = f.read(200000)
              t = re.search(r"<title[^>]*>(.*?)</title>", kopf, re.S | re.I)
              d = re.search(r'<meta\s+name=["\']description["\']\s+content=["\'](.*?)["\']', kopf, re.S | re.I)
              return (html.unescape(t.group(1)).strip() if t else ""), (html.unescape(d.group(1)).strip() if d else "")
          # Bestehende Apps auf der Hauptebene (Adresse bleibt gleich)
          FEST = {"schreibwerkstatt.html": ("deutsch", "Aufsätze überarbeiten"),
                  "instrumente.html": ("musik", "Instrumente"),
                  "rhythmus.html": ("musik", "Rhythmus")}
          KUERZEL = {"mathe": "mathematik", "mathematik": "mathematik",
                     "deutsch": "deutsch", "musik": "musik"}
          gefunden = {f: {} for f in FAECHER}
          def eintragen(fach, thema, pfad, name, titel_vorgabe=""):
              endung = os.path.splitext(name)[1].lower()
              titel, info = (html_infos(pfad) if ARTEN[endung] == "App" else ("", ""))
              gefunden[fach].setdefault(nfc(thema), []).append({
                  "titel": nfc(titel or titel_vorgabe or lesbar(name)), "info": nfc(info),
                  "datei": pfad.replace(os.sep, "/"), "art": ARTEN[endung]})
          # 1) Dateien auf der Hauptebene: Fach_Thema_Titel.pdf
          for d in os.listdir("."):
              endung = os.path.splitext(d)[1].lower()
              if not os.path.isfile(d) or endung not in ARTEN or d.startswith((".", "_")):
                  continue
              if d in FEST:
                  eintragen(FEST[d][0], FEST[d][1], d, d)
                  continue
              teile = os.path.splitext(d)[0].split("_")
              fach = KUERZEL.get(nfc(teile[0]).strip().lower())
              if fach and len(teile) >= 3:
                  eintragen(fach, teile[1].strip(), d, d, " ".join(teile[2:]).strip())
              elif fach and len(teile) == 2:
                  eintragen(fach, "Weitere Materialien", d, d, teile[1].strip())
          # 2) Dateien in Ordnern: mathematik/Thema/datei.pdf
          for fach in FAECHER:
              if not os.path.isdir(fach):
                  continue
              for wurzel, ordner, dateien in os.walk(fach):
                  ordner[:] = [o for o in ordner if not o.startswith((".", "_"))]
                  teile = os.path.relpath(wurzel, fach).split(os.sep)
                  thema = " / ".join(teile) if teile != ["."] else "Weitere Materialien"
                  for d in dateien:
                      if d.startswith((".", "_")) or os.path.splitext(d)[1].lower() not in ARTEN:
                          continue
                      eintragen(fach, thema, os.path.join(wurzel, d), d)
          liste = {f: [{"thema": t, "eintraege": sorted(e, key=lambda x: sortkey(x["datei"]))}
                       for t, e in sorted(th.items(), key=lambda x: sortkey(x[0]))]
                   for f, th in gefunden.items()}
          with open("liste.json", "w", encoding="utf-8") as f:
              json.dump(liste, f, ensure_ascii=False, indent=1)
          for fach, th in liste.items():
              print(fach, sum(len(t["eintraege"]) for t in th), "Materialien")

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
