<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sprichwörter – Lernapp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bitter:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F6; --paper:#FFFFFF; --ink:#18324F; --soft:#5A6B80; --line:#C9D3DE;
  --accent:#F2B705; --accent-ink:#3A2C00; --ok:#1E7F4F; --ok-bg:#DDF3E7; --no:#B23A30; --no-bg:#F8E1DE;
  --tab:#DCE4EC;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A26; --paper:#182636; --ink:#E6EDF5; --soft:#9AAABD; --line:#2E4157;
    --accent:#F2B705; --accent-ink:#2A2000; --ok:#5FD39A; --ok-bg:#16382A; --no:#FF8A7E; --no-bg:#3E1D1A;
    --tab:#22344A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A26; --paper:#182636; --ink:#E6EDF5; --soft:#9AAABD; --line:#2E4157;
  --accent:#F2B705; --accent-ink:#2A2000; --ok:#5FD39A; --ok-bg:#16382A; --no:#FF8A7E; --no-bg:#3E1D1A;
  --tab:#22344A; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Atkinson Hyperlegible",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:18px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 48px}
header h1{font-family:Bitter,Georgia,serif;font-weight:800;font-size:clamp(30px,6vw,44px);line-height:1.1;margin:8px 0 4px;letter-spacing:-.01em}
header p{margin:0 0 18px;color:var(--soft)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{flex:1 1 140px;border:0;border-radius:12px;padding:12px 10px;font:inherit;font-weight:700;
  background:var(--tab);color:var(--ink);cursor:pointer;min-height:48px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.opts{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin:4px 0 20px;font-size:16px;color:var(--soft)}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:10px;overflow:hidden;margin-left:6px}
.seg button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;padding:7px 12px;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.progress{display:flex;justify-content:space-between;font-size:16px;color:var(--soft);margin-bottom:8px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}

/* Der Sprichwort-Streifen: Anfang oben, Ende unten – wie auf dem Blatt */
.strip{background:var(--paper);border-radius:6px;box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line);overflow:hidden}
.half{padding:26px 22px;text-align:center;font-family:Bitter,Georgia,serif;font-weight:600;font-size:clamp(22px,4.6vw,30px);line-height:1.25}
.cut{position:relative;border-top:2px dashed var(--line);margin:0 14px}
.cut span{position:absolute;left:-4px;top:-15px;font-size:20px;background:var(--paper);padding:0 4px;line-height:1}
.half.missing{color:var(--soft);letter-spacing:.2em}
.half.reveal{color:var(--ok);animation:pop .35s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.pic svg{display:block;width:100%;height:auto}

.ask{font-weight:700;margin:22px 0 10px}
.choices{display:grid;gap:10px}
.choices button{text-align:left;border:2px solid var(--line);background:var(--paper);color:var(--ink);
  border-radius:12px;padding:14px 16px;font:inherit;cursor:pointer;min-height:54px}
.choices button:hover:not(:disabled){border-color:var(--ink)}
.choices button.ok{border-color:var(--ok);background:var(--ok-bg)}
.choices button.no{border-color:var(--no);background:var(--no-bg)}
.choices button:disabled{cursor:default}
.feedback{margin-top:16px;padding:16px 18px;border-radius:12px;background:var(--paper);border-left:6px solid var(--ink)}
.feedback.ok{border-left-color:var(--ok)}
.feedback.no{border-left-color:var(--no)}
.feedback b{display:block;margin-bottom:4px}
.feedback .full{font-family:Bitter,Georgia,serif;font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{border:0;border-radius:12px;padding:14px 20px;font:inherit;font-weight:700;cursor:pointer;min-height:52px;flex:1 1 180px}
.btn.main{background:var(--ink);color:var(--paper)}
.btn.yes{background:var(--ok);color:#fff}
.btn.later{background:var(--no);color:#fff}
.btn.ghost{background:var(--tab);color:var(--ink)}

.result{text-align:center;background:var(--paper);border-radius:12px;padding:30px 20px}
.result .big{font-family:Bitter,Georgia,serif;font-weight:800;font-size:56px;line-height:1}
.result p{color:var(--soft)}

.search{width:100%;font:inherit;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);margin-bottom:16px}
.list{display:grid;gap:12px}
.item{background:var(--paper);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:start}
.item .t{font-family:Bitter,Georgia,serif;font-weight:600;font-size:20px;line-height:1.3}
.item .t em{font-style:normal;color:var(--soft)}
.item .e{grid-column:1/2;color:var(--soft);font-size:17px}
.item .p{grid-row:1/3;grid-column:2;width:128px}.item .p svg{display:block;width:100%;height:auto;border-radius:8px}
@media (max-width:520px){.item{grid-template-columns:1fr}.item .p{grid-row:auto;grid-column:auto;width:100%;max-width:260px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Sprichwörter</h1>
    <p>36 Sprichwörter üben – Bedeutung, Ende und Bilder.</p>
  </header>

  <nav class="tabs" aria-label="Übungsart">
    <button data-mode="bed" aria-pressed="true">Bedeutung</button>
    <button data-mode="ende" aria-pressed="false">Ende ergänzen</button>
    <button data-mode="bild" aria-pressed="false">Bild erkennen</button>
    <button data-mode="liste" aria-pressed="false">Alle ansehen</button>
  </nav>

  <div class="opts" id="opts">
    <label>So übe ich:<span class="seg" id="art">
      <button data-art="wahl" aria-pressed="true">Auswählen</button>
      <button data-art="sagen" aria-pressed="false">Selber sagen</button></span></label>
    <label>Anzahl:<span class="seg" id="anz">
      <button data-n="10" aria-pressed="true">10</button>
      <button data-n="20" aria-pressed="false">20</button>
      <button data-n="999" aria-pressed="false">Alle</button></span></label>
  </div>

  <main id="app" aria-live="polite"></main>
</div>

h d=\"M270.725 111.32499999999999 Q275 118.44999999999999 279.275 111.32499999999999Z\" fill=\"#8B2D2D\" stroke=\"#2B2B2B\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"275\" y=\"45\" text-anchor=\"middle\" font-family=\"Arial,Helvetica,sans-serif\" font-weight=\"700\" font-size=\"16\" fill=\"#3D7CC9\">HAHA!</text><path d=\"M262 66 h26 v8 q0 14 -13 15 q-13 -1 -13 -15Z\" fill=\"#F2B705\"/><rect x=\"270\" y=\"88\" width=\"10\" height=\"8\" fill=\"#C9A227\"/></svg>","35":"<svg viewBox=\"0 0 320 200\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><rect width=\"320\" height=\"200\" fill=\"#CFE8F7\"/><rect y=\"160\" width=\"320\" height=\"40\" fill=\"#7CC36E\"/><path d=\"M30 90 L95 40 L160 90Z\" fill=\"#BFE3F2\" stroke=\"#7FB5CC\" stroke-width=\"3\" opacity=\".9\"/><rect x=\"40\" y=\"90\" width=\"110\" height=\"72\" fill=\"#BFE3F2\" stroke=\"#7FB5CC\" stroke-width=\"3\" opacity=\".9\"/><path d=\"M95 40 V162 M40 125 H150\" stroke=\"#7FB5CC\" stroke-width=\"2\"/><path d=\"M75.75 139.60000000000002 L74.9 160 M84.25 139.60000000000002 L85.1 160\" stroke=\"#33415C\" stroke-width=\"5.95\" stroke-linecap=\"round\"/><path d=\"M73.2 123.45000000000002 L68.36008385658286 141.51281295160558 M86.8 123.45000000000002 L96.14999999999999 107.25532494923101\" stroke=\"#3D7CC9\" stroke-width=\"5.1\" stroke-linecap=\"round\"/><circle cx=\"68.36008385658286\" cy=\"141.51281295160558\" r=\"2.72\" fill=\"#F2C9A0\"/><circle cx=\"96.14999999999999\" cy=\"107.25532494923101\" r=\"2.72\" fill=\"#F2C9A0\"/><rect x=\"71.5\" y=\"119.20000000000002\" width=\"17\" height=\"23.8\" rx=\"5.95\" fill=\"#3D7CC9\"/><circle cx=\"80\" cy=\"109.85000000000002\" r=\"9.35\" fill=\"#F2C9A0\"/><path d=\"M70.65 109.00000000000003 Q70.65 98.80000000000003 80 99.65000000000002 Q89.35 98.80000000000003 89.35 109.00000000000003 Q85.1 103.90000000000002 70.65 109.00000000000003Z\" fill=\"#5A3A1E\"/><circle cx=\"76.94\" cy=\"108.57500000000002\" r=\"1.19\" fill=\"#2B2B2B\"/><circle cx=\"83.06\" cy=\"108.57500000000002\" r=\"1.19\" fill=\"#2B2B2B\"/><path d=\"M76.6 114.95000000000003 Q80 111.55000000000003 83.4 114.95000000000003\" fill=\"none\" stroke=\"#2B2B2B\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M74.9 104.75000000000003 L78.725 106.45000000000002 M85.1 104.75000000000003 L81.275 106.45000000000002\" stroke=\"#2B2B2B\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><ellipse cx=\"200\" cy=\"70\" rx=\"10\" ry=\"8\" fill=\"#888\" stroke=\"#2B2B2B\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M175 78 q-15 -2 -25 5 M178 86 q-12 2 -22 10\" stroke=\"#5A6B80\" stroke-width=\"2\" fill=\"none\"/><path d=\"M128 60 l8 8 l-6 6 l10 6 M118 70 l-6 10\" fill=\"none\" stroke=\"#5A8FA8\" stroke-width=\"2\"/><path d=\"M265 141 L264 165 M275 141 L276 165\" stroke=\"#33415C\" stroke-width=\"7\" stroke-linecap=\"round\"/><path d=\"M262 122 L256.30598100774455 143.2503681783595 M278 122 L283.69401899225545 143.2503681783595\" stroke=\"#E8A33A\" stroke-width=\"6\" stroke-linecap=\"round\"/><circle cx=\"256.30598100774455\" cy=\"143.2503681783595\" r=\"3.2\" fill=\"#F2C9A0\"/><circle cx=\"283.69401899225545\" cy=\"143.2503681783595\" r=\"3.2\" fill=\"#F2C9A0\"/><rect x=\"260\" y=\"117\" width=\"20\" height=\"28\" rx=\"7\" fill=\"#E8A33A\"/><circle cx=\"270\" cy=\"106\" r=\"11\" fill=\"#F2C9A0\"/><path d=\"M259 105 Q259 93 270 94 Q281 93 281 105 Q276 99 259 105Z\" fill=\"#5A3A1E\"/><circle cx=\"266.4\" cy=\"104.5\" r=\"1.4\" fill=\"#2B2B2B\"/><circle cx=\"273.6\" cy=\"104.5\" r=\"1.4\" fill=\"#2B2B2B\"/><ellipse cx=\"270\" cy=\"110.5\" rx=\"2.2\" ry=\"2.8\" fill=\"#8B2D2D\" stroke=\"#2B2B2B\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"240\" y=\"98\" width=\"64\" height=\"0\" /></svg>"};
D.forEach((q,i)=>q.p=IMG[i]||null);
const full=q=>q.a+" "+q.b;
const S={mode:"bed",art:"wahl",n:10,queue:[],i:0,right:0,wrong:[]};
const app=document.getElementById("app");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function setPressed(group,attr,val){document.querySelectorAll(group+" button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset[attr]===String(val))))}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;setPressed(".tabs","mode",S.mode);start()});
document.querySelectorAll("#art button").forEach(b=>b.onclick=()=>{S.art=b.dataset.art;setPressed("#art","art",S.art);start()});
document.querySelectorAll("#anz button").forEach(b=>b.onclick=()=>{S.n=+b.dataset.n;setPressed("#anz","n",S.n);start()});

function start(list){
  document.getElementById("opts").style.display=S.mode==="liste"?"none":"";
  if(S.mode==="liste")return renderList();
  const pool=S.mode==="bild"?D.filter(q=>q.p):D;
  S.queue=list?shuffle(list):shuffle(pool).slice(0,S.n);
  S.i=0;S.right=0;S.wrong=[];
  renderQ();
}

function stripHTML(q,showEnd){
  return `<div class="strip"><div class="half">${esc(q.a)}</div><div class="cut"><span aria-hidden="true">✂️</span></div>`+
   (showEnd===true?`<div class="half">${esc(q.b)}</div>`:`<div class="half missing" id="end" aria-label="Ende fehlt">…</div>`)+`</div>`;
}

function renderQ(){
  const q=S.queue[S.i], n=S.queue.length;
  let top="",ask="";
  if(S.mode==="bed"){top=stripHTML(q,true);ask=S.art==="wahl"?"Wähle die richtige Bedeutung.":"Sage laut, was dieses Sprichwort bedeutet. Tippe dann auf „Lösung zeigen“."}
  if(S.mode==="ende"){top=stripHTML(q,false);ask=S.art==="wahl"?"Wähle das richtige Ende.":"Nenne das Ende des Sprichworts. Tippe dann auf „Lösung zeigen“."}
  if(S.mode==="bild"){top=`<div class="strip"><div class="pic" role="img" aria-label="Bilderrätsel">${q.p}</div></div>`;ask=S.art==="wahl"?"Welches Sprichwort ist gemeint? Wähle aus.":"Welches Sprichwort ist gemeint? Sage es laut. Tippe dann auf „Lösung zeigen“."}
  let body="";
  if(S.art==="wahl"){
    const key=S.mode==="bed"?"e":S.mode==="ende"?"b":"full";
    const val=x=>key==="full"?full(x):x[key];
    const others=shuffle(D.filter(x=>x!==q)).slice(0,3);
    const opts=shuffle([q,...others]);
    body=`<div class="choices">${opts.map(o=>`<button data-ok="${o===q}">${esc(val(o))}</button>`).join("")}</div><div id="fb"></div>`;
  }else{
    body=`<div class="row" id="rv"><button class="btn main" id="show">Lösung zeigen</button></div><div id="fb"></div>`;
  }
  app.innerHTML=`<div class="progress"><span>Frage ${S.i+1} von ${n}</span><span>✓ ${S.right}</span></div>
   <div class="bar"><i style="width:${S.i/n*100}%"></i></div>${top}<p class="ask">${ask}</p>${body}`;

  if(S.art==="wahl"){
    app.querySelectorAll(".choices button").forEach(b=>b.onclick=()=>{
      const ok=b.dataset.ok==="true";
      app.querySelectorAll(".choices button").forEach(x=>{x.disabled=true;if(x.dataset.ok==="true")x.classList.add("ok")});
      if(!ok)b.classList.add("no");
      answer(q,ok);
    });
  }else{
    document.getElementById("show").onclick=()=>{
      solution(q,null);
      document.getElementById("rv").innerHTML=`<button class="btn yes" id="y">✓ Gewusst</button><button class="btn later" id="n">Noch nicht gewusst</button>`;
      document.getElementById("y").onclick=()=>next(q,true);
      document.getElementById("n").onclick=()=>next(q,false);
      document.getElementById("y").focus();
    };
  }
}

function solution(q,ok){
  const end=document.getElementById("end");
  if(end){end.textContent=q.b;end.className="half reveal";end.removeAttribute("aria-label")}
  const cls=ok===null?"":ok?"ok":"no";
  const head=ok===null?"Lösung":ok?"Richtig!":"Leider falsch.";
  document.getElementById("fb").innerHTML=`<div class="feedback ${cls}"><b>${head}</b><div class="full">${esc(full(q))}</div><div>${esc(q.e)}</div></div>`;
}

function answer(q,ok){
  solution(q,ok);
  const fb=document.getElementById("fb");
  fb.insertAdjacentHTML("beforeend",`<div class="row"><button class="btn main" id="go">Weiter</button></div>`);
  const go=document.getElementById("go");go.onclick=()=>next(q,ok);go.focus();
}

function next(q,ok){
  if(ok)S.right++;else S.wrong.push(q);
  S.i++;
  if(S.i<S.queue.length)renderQ();else renderEnd();
}

function renderEnd(){
  const n=S.queue.length;
  const msg=S.right===n?"Alles richtig – super!":S.right>=n*0.7?"Gut gemacht!":"Übe weiter, das wird!";
  app.innerHTML=`<div class="result"><div class="big">${S.right} / ${n}</div><p>${msg}</p>
   <div class="row">${S.wrong.length?`<button class="btn main" id="rep">Falsche nochmals üben (${S.wrong.length})</button>`:""}
   <button class="btn ${S.wrong.length?"ghost":"main"}" id="new">Neue Runde</button></div></div>`;
  const rep=document.getElementById("rep");
  if(rep)rep.onclick=()=>start(S.wrong.slice());
  document.getElementById("new").onclick=()=>start();
}

function renderList(){
  app.innerHTML=`<input class="search" id="s" type="search" placeholder="Sprichwort suchen …" aria-label="Sprichwort suchen"><div class="list" id="l"></div>`;
  const draw=f=>{
    const t=f.trim().toLowerCase();
    document.getElementById("l").innerHTML=D.filter(q=>!t||(full(q)+" "+q.e).toLowerCase().includes(t))
     .map(q=>`<div class="item"><div class="t">${esc(q.a)} <em>${esc(q.b)}</em></div>${q.p?`<div class="p">${q.p}</div>`:""}<div class="e">${esc(q.e)}</div></div>`).join("")||"<p>Kein Sprichwort gefunden. Versuche ein anderes Wort.</p>";
  };
  draw("");
  document.getElementById("s").oninput=e=>draw(e.target.value);
}
start();
</script>
